name: lyricanki
description: "Turn song lyrics into an Anki vocabulary deck: every unique word, lemmatised, glossed from a real dictionary, with the lyric line it came from."
publish_to: 'none'
version: 1.0.23+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.7
  # The merge primitives (LogStore, Record, Hlc) the history log is built on.
  # Listed explicitly even though crdt_sync_flutter re-exports them: this app
  # imports them directly, and a transitive dependency is not a promise.
  crdt_sync:
    git:
      url: https://github.com/kuhyx/utils
      ref: crdt_sync_dart-v0.11.0
      path: crdt_sync_dart
  crdt_sync_flutter:
    git:
      url: https://github.com/kuhyx/utils
      ref: crdt_sync_flutter-v0.1.1
      path: crdt_sync_flutter
  crypto: ^3.0.6
  # The shared palette, scales and components. Owns the tokens: there is
  # deliberately no local theme.dart to drift from the frozen table.
  design_system:
    git:
      url: https://github.com/kuhyx/utils
      ref: design_system-v0.1.0
      path: design_system
  flutter:
    sdk: flutter
  http: ^1.6.0
  meta: ^1.19.0
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^13.3.0
  sqlite3: ^3.0.0
  # The shared "Sync settings" screen, identical across every app that syncs.
  sync_settings_ui:
    git:
      url: https://github.com/kuhyx/utils
      ref: sync_settings_ui-v0.2.0
      path: sync_settings_ui

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  # Lets the export flow be tested without a real Android documents directory:
  # the fake overrides getApplicationDocumentsPath.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  # Stricter than flutter_lints -- standardized across this ecosystem's
  # Flutter apps (all Flutter apps use very_good_analysis, not flutter_lints).
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true

# PYTHONPATH=~/testsAndMisc python3 -m python_pkg.app_icons generate --app lyricanki
# then: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#211D1B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 21
